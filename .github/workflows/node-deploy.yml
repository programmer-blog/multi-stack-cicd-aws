name: Node.js Docker Build and Deploy

on:
    push:
        paths:
            - "node-app/**"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./node-app
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

    deploy:
        needs: build-and-push # Only deploy if the build succeeds
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # 1. Login to Docker (optional if public, but good practice)
                      # 2. Pull the latest image
                      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

                      # 3. Stop and remove the old container if it exists
                      docker stop node-app || true
                      docker rm node-app || true

                      # 4. Run the new container
                      # Mapping port 80 (standard web) to 3000 (app port)
                      docker run -d --name node-app -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

                      # 5. Clean up old unused images to save space
                      docker image prune -f

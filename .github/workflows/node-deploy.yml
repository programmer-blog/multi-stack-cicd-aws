name: Node.js Docker Build and Deploy

on:
    push:
        paths:
            - "node-app/**"

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                  context: ./node-app
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ec2-user
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      # Pull the latest image from Docker Hub
                      docker pull ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

                      # Stop and remove the existing container (ignore errors if it doesn't exist)
                      docker stop node-app || true
                      docker rm node-app || true

                      # Start the new container with a fixed name and port 80
                      docker run -d --name node-app -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/node-app:latest

                      # Housekeeping: Remove old images to save disk space
                      docker image prune -f

name: Java Enterprise Deploy

on:
  push:
    paths:
      - "java-app/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Build JAR with Maven
        run: |
          cd java-app
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./java-app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/java-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Stop other apps to free up RAM for Java
            docker stop node-app python-app php-app || true

            # 2. Pull the latest Java image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/java-app:latest

            # 3. Stop/Remove old Java container
            docker stop java-app || true
            docker rm java-app || true

            # 4. Run Java on Port 8083 
            # We limit memory to 512MB so the EC2 stays stable
            docker run -d --name java-app \
              -m 512m \
              -p 8083:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/java-app:latest

            # Cleanup
            docker image prune -f
